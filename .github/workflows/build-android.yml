name: Build Native Android App (Capacitor)

on:
  # Manual only: build runs when you press "Run workflow" in the Actions tab
  workflow_dispatch:

# never run two builds at the same time (they share the signing key cache)
concurrency:
  group: vvault-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          # VERSION file only sets the first two numbers (e.g. 1.0); the last number
          # is the build number, so every build gets a new version automatically.
          BASE=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          [ -z "$BASE" ] && BASE="1.0.0"
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1-2)
          VERSION="$MAJOR_MINOR.${{ github.run_number }}"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "num=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found at repo root — Capacitor project is not set up here."
            exit 1
          fi

      - name: Build web assets (if a build script exists)
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No 'build' script in package.json — skipping."
          fi

      - name: Inject app version into web assets
        run: |
          WEBDIR="www"
          if [ -f capacitor.config.json ]; then
            CONFIGURED=$(node -p "require('./capacitor.config.json').webDir || 'www'" 2>/dev/null || echo "www")
            [ -n "$CONFIGURED" ] && WEBDIR="$CONFIGURED"
          fi
          mkdir -p "$WEBDIR"
          echo "window.APP_VERSION = '${{ steps.ver.outputs.num }}';" > "$WEBDIR/version.js"
          echo "Wrote version.js (v${{ steps.ver.outputs.num }}) into $WEBDIR/"
          cp vault.html "$WEBDIR/vault.html"
          echo "Copied vault.html into $WEBDIR/"

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found — adding Capacitor Android platform."
            npx cap add android
          fi

      - name: Set Android versionCode / versionName
        run: |
          GRADLE="android/app/build.gradle"
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.num }}\"/" "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE" || echo "WARNING: versionCode/versionName not found in $GRADLE"

      - name: Add biometric (fingerprint) plugin
        run: |
          # plugin major version follows the Capacitor major version
          CAP_MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major: $CAP_MAJOR"
          npm install "@capgo/capacitor-native-biometric@$CAP_MAJOR" --save \
            || npm install "@capgo/capacitor-native-biometric@latest" --save
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' "$MANIFEST"
            echo "Added USE_BIOMETRIC permission"
          fi

      - name: Add back-button plugin (@capacitor/app)
        run: |
          CAP_MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capacitor/app@$CAP_MAJOR" --save \
            || npm install "@capacitor/app@latest" --save

      - name: Add Google Drive backup plugin (@capacitor/browser)
        run: |
          CAP_MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capacitor/browser@$CAP_MAJOR" --save \
            || npm install "@capacitor/browser@latest" --save

      - name: Add app permissions (camera, gallery, file access)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          add_line() {
            # $1 = grep key (to skip if already present), $2 = full XML line
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "s#<application#$2\n    <application#" "$MANIFEST"
              echo "Added $1"
            fi
          }
          add_line 'android.permission.CAMERA"' '<uses-permission android:name="android.permission.CAMERA" />'
          add_line 'android.hardware.camera"' '<uses-feature android:name="android.hardware.camera" android:required="false" />'
          add_line 'android.permission.READ_MEDIA_IMAGES"' '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'
          add_line 'android.permission.READ_MEDIA_VIDEO"' '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />'
          add_line 'android.permission.READ_EXTERNAL_STORAGE"' '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          add_line 'android.permission.WRITE_EXTERNAL_STORAGE"' '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'
          add_line 'android.permission.MANAGE_EXTERNAL_STORAGE"' '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'
          echo "--- manifest permissions ---"
          grep -n "uses-permission\|uses-feature" "$MANIFEST"

      - name: Add VaultMedia native plugin + MainActivity
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_DIR="android/app/src/main/java/$(echo $APP_ID | tr '.' '/')"
          mkdir -p "$PKG_DIR"
          sed "s/__APP_ID__/$APP_ID/" .github/native/VaultMediaPlugin.java > "$PKG_DIR/VaultMediaPlugin.java"
          sed "s/__APP_ID__/$APP_ID/" .github/native/MainActivity.java > "$PKG_DIR/MainActivity.java"

      - name: Add Google Play services auth (silent Google Drive login)
        run: |
          GRADLE="android/app/build.gradle"
          if ! grep -q "play-services-auth" "$GRADLE"; then
            sed -i '/^dependencies {/a\    implementation "com.google.android.gms:play-services-auth:21.2.0"' "$GRADLE"
          fi
          grep -n "play-services-auth" "$GRADLE"

      - name: Add Share-to-app intent filters (share photos/videos into V Vault)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.intent.action.SEND"' "$MANIFEST"; then
            FILTERS=$(mktemp)
            {
              echo '    <intent-filter>'
              echo '        <action android:name="android.intent.action.SEND" />'
              echo '        <category android:name="android.intent.category.DEFAULT" />'
              echo '        <data android:mimeType="image/*" />'
              echo '    </intent-filter>'
              echo '    <intent-filter>'
              echo '        <action android:name="android.intent.action.SEND" />'
              echo '        <category android:name="android.intent.category.DEFAULT" />'
              echo '        <data android:mimeType="video/*" />'
              echo '    </intent-filter>'
              echo '    <intent-filter>'
              echo '        <action android:name="android.intent.action.SEND_MULTIPLE" />'
              echo '        <category android:name="android.intent.category.DEFAULT" />'
              echo '        <data android:mimeType="image/*" />'
              echo '    </intent-filter>'
              echo '    <intent-filter>'
              echo '        <action android:name="android.intent.action.SEND_MULTIPLE" />'
              echo '        <category android:name="android.intent.category.DEFAULT" />'
              echo '        <data android:mimeType="video/*" />'
              echo '    </intent-filter>'
            } > "$FILTERS"
            # Insert the new filters right after the existing (MAIN/LAUNCHER) intent-filter,
            # so they land inside the same <activity>...</activity> block.
            sed -i "/<\/intent-filter>/r $FILTERS" "$MANIFEST"
            echo "Added Share intent-filters"
          else
            echo "Share intent-filters already present — skipping"
          fi
          echo "--- activity block ---"
          grep -n "intent-filter\|SEND\|action android:name" "$MANIFEST"

      - name: Add Google sign-in deep link (vvaultauth://callback)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'vvaultauth"' "$MANIFEST"; then
            FILTER=$(mktemp)
            {
              echo '    <intent-filter>'
              echo '        <action android:name="android.intent.action.VIEW" />'
              echo '        <category android:name="android.intent.category.DEFAULT" />'
              echo '        <category android:name="android.intent.category.BROWSABLE" />'
              echo '        <data android:scheme="vvaultauth" android:host="callback" />'
              echo '    </intent-filter>'
            } > "$FILTER"
            # Insert right after the first existing intent-filter close tag,
            # so it lands inside the same <activity>...</activity> block.
            sed -i "0,/<\/intent-filter>/{/<\/intent-filter>/r $FILTER
            }" "$MANIFEST"
            echo "Added vvaultauth:// deep link intent-filter"
          else
            echo "vvaultauth deep link already present — skipping"
          fi
          echo "--- activity block ---"
          grep -n "intent-filter\|vvaultauth\|scheme" "$MANIFEST"

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          if [ -f icon-512.png ]; then
            cp icon-512.png assets/icon.png
          elif [ -f icon-192.png ]; then
            cp icon-192.png assets/icon.png
          fi

      - name: Generate app icons
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#E4EEFC' --iconBackgroundColorDark '#0B0D10'
          else
            echo "No icon source found (icon-512.png / icon-192.png) — skipping icon generation."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore cached keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: keystore-cache
          key: vvault-release-keystore-v1

      - name: Generate keystore (first run only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore-cache
          keytool -genkeypair -v \
            -keystore keystore-cache/vvault-release.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=V Vault, OU=App, O=VVault, C=IN"

      - name: Print keystore SHA-1 (for Google OAuth Android client setup)
        run: |
          echo "=================================================="
          echo " Copy the SHA1 line below into Google Cloud Console"
          echo "=================================================="
          keytool -list -v \
            -keystore keystore-cache/vvault-release.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA1:"

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore-cache/vvault-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK with version
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk \
             release-out/vvault-${{ steps.ver.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvault-release-apk
          path: release-out/vvault-${{ steps.ver.outputs.tag }}.apk

      - name: Upload keystore backup (save this somewhere safe!)
        uses: actions/upload-artifact@v4
        with:
          name: vvault-keystore-backup
          path: keystore-cache/vvault-release.jks

      - name: Publish GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: V Vault ${{ steps.ver.outputs.tag }}
          files: release-out/vvault-${{ steps.ver.outputs.tag }}.apk
          make_latest: true
